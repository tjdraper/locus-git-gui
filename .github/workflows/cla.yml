name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the contributor license agreement
        if: >-
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          || github.event_name == 'pull_request_target'
        # v2.6.1. Pinned to a commit because pull_request_target runs with write access to this
        # repository, and a tag can be moved to different code.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/tjdraper/locus-git-gui/blob/main/CONTRIBUTING.md#contributor-license-agreement
          path-to-signatures: signatures/version1/cla.json
          # Kept off main, so signing never adds commits to the branch releases are tagged from.
          branch: cla-signatures
          allowlist: tjdraper,dependabot[bot]
